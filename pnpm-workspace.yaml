packages:
  - "apps/*"
  - "packages/*"

# React Native / Expo does not support pnpm's isolated node_modules layout.
# https://docs.expo.dev/guides/monorepos/
nodeLinker: hoisted

# Versions shared by more than one workspace live here so a bump is a one-line
# edit rather than a sweep across 12 manifests. Workspaces reference these with
# "catalog:" in place of a range; pnpm resolves them at install time and fails
# the install if a name is missing here, so a drifted copy cannot go unnoticed.
catalog:
  # Runtime, shared by api / worker / packages
  "@logtape/logtape": ^2.3.2
  drizzle-orm: ^0.45.2
  pg: ^8.23.0
  valibot: ^1.4.2

  # Toolchain, shared by every workspace
  eslint: ^9.39.5
  typescript: ~6.0.3
  vitest: ^4.1.11

  # Dev-only, shared by a subset
  "@types/node": ^26.2.0
  "@types/pg": ^8.23.1
  eslint-plugin-astro: ^1.7.0
  tsx: ^4.23.12

allowBuilds:
  esbuild: true
  unrs-resolver: true
  # Optional native bindings pulled in by testcontainers -> dockerode -> ssh2.
  # Declined so installs need no C++ toolchain; the pure-JS fallbacks are used.
  cpu-features: false
  ssh2: false
  protobufjs: false
  # Postinstall only writes a local telemetry notice; declined — nothing here needs it.
  '@clerk/shared': false
  # Postinstall only prints a sponsorship/donation banner; declined — no functional impact.
  browser-tabs-lock: false
  core-js: false
  # Native bindings used by `ws` for faster UTF-8 validation and frame masking;
  # declined so installs need no C++ toolchain. `ws` falls back to its pure-JS
  # implementations when they are unavailable. Both reach us only through
  # apps/mobile (@expo/cli), so neither appears in the pruned lockfile the
  # Dockerfile installs from — but leaving either undecided makes a fresh
  # `pnpm install --frozen-lockfile` exit 1, which would fail CI.
  utf-8-validate: false
  bufferutil: false
  # Tailwind 4's native engine and Astro's image pipeline. Both have native
  # postinstall steps; leaving either undecided makes a fresh
  # `pnpm install --frozen-lockfile` exit 1, which fails CI.
  '@tailwindcss/oxide': true
  sharp: true

minimumReleaseAgeExclude:
  # expo-secure-store@57.0.2 was published within pnpm 11's default cooling-off
  # window, and it is the SDK-57-recommended version.
  - expo-secure-store@57.0.2
  - framer-motion@13.2.0
  - motion-dom@13.2.0
  - motion@13.2.0
  - '@expo/cli@57.0.22'
  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo@57.0.20
  - '@expo/ui@57.0.16'
  - expo-router@57.0.19
  - expo-sharing@57.0.18
