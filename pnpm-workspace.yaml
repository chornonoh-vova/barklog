packages:
  - "apps/*"
  - "packages/*"

# React Native / Expo does not support pnpm's isolated node_modules layout.
# https://docs.expo.dev/guides/monorepos/
nodeLinker: hoisted

# Versions shared by more than one workspace live here so a bump is a one-line
# edit rather than a sweep across 12 manifests. Workspaces reference these with
# "catalog:" in place of a range; pnpm resolves them at install time and fails
# the install if a name is missing here, so a drifted copy cannot go unnoticed.
catalog:
  # Runtime, shared by api / worker / packages
  "@logtape/logtape": ^2.4.2
  drizzle-orm: ^0.45.4
  pg: ^8.23.1
  valibot: ^1.5.0

  # Toolchain, shared by every workspace
  eslint: ^10.12.0
  typescript: ~7.0.2
  vitest: ^5.0.3

  # Dev-only, shared by a subset
  "@types/node": ^26.6.5
  "@types/pg": ^8.23.1
  eslint-plugin-astro: ^3.2.1
  tsx: ^4.23.15

# apps/mobile cannot move to ESLint 10 yet. eslint-config-expo depends on
# eslint-plugin-react, whose latest release (7.37.5, April 2025) peers on
# eslint <= 9 and still calls context.getFilename()/getSourceCode()/getScope(),
# all removed in ESLint 10. Loading any react/* rule throws:
#   TypeError: contextOrFilename.getFilename is not a function
# Tracked upstream at expo/expo#46717 and jsx-eslint/eslint-plugin-react#3977.
# Mobile therefore stays on the EOL 9.x line until that lands; everything else
# is on 10. Collapse this into the default catalog when it does.
catalogs:
  eslint9:
    eslint: ^9.39.5

# eslint-config-expo depends on @typescript-eslint/eslint-plugin ^8.59.0 of its
# own. Without these, bumping the top-level typescript-eslint resolves a second
# copy while expo keeps the older one, and flat config rejects two different
# plugin objects registered under the same "@typescript-eslint" name:
#   ConfigError: Key "plugins": Cannot redefine plugin "@typescript-eslint"
# which fails apps/mobile's lint. Forcing one version restores the dedupe.
# Drop these once eslint-config-expo's own range covers the version we use.
overrides:
  "@typescript-eslint/eslint-plugin": 8.71.1
  "@typescript-eslint/parser": 8.71.1
  # jest-expo depends on jest-environment-jsdom, which brings @types/jsdom; the
  # hoisted layout puts it at the root, where Vitest's own types import it and
  # its `/// <reference lib="dom" />` swaps Node's `Response` for the DOM's in
  # every Vitest workspace. apps/api's check-types then fails:
  #   undici's Response is not assignable to parameter of type 'Response'
  # No workspace imports jsdom's types: apps/mobile runs jest-expo/ios (React
  # Native's environment), and apps/landing runs jsdom only as a Vitest
  # environment. Drop this if jest-expo stops pulling jsdom.
  "@types/jsdom": "-"

allowBuilds:
  esbuild: true
  unrs-resolver: true
  # Optional native bindings pulled in by testcontainers -> dockerode -> ssh2.
  # Declined so installs need no C++ toolchain; the pure-JS fallbacks are used.
  cpu-features: false
  ssh2: false
  protobufjs: false
  # Postinstall only writes a local telemetry notice; declined — nothing here needs it.
  "@clerk/shared": false
  # Postinstall only prints a sponsorship/donation banner; declined — no functional impact.
  browser-tabs-lock: false
  core-js: false
  # Native bindings used by `ws` for faster UTF-8 validation and frame masking;
  # declined so installs need no C++ toolchain. `ws` falls back to its pure-JS
  # implementations when they are unavailable. Both reach us only through
  # apps/mobile (@expo/cli), so neither appears in the pruned lockfile the
  # Dockerfile installs from — but leaving either undecided makes a fresh
  # `pnpm install --frozen-lockfile` exit 1, which would fail CI.
  utf-8-validate: false
  bufferutil: false
  # Tailwind 4's native engine and Astro's image pipeline. Both have native
  # postinstall steps; leaving either undecided makes a fresh
  # `pnpm install --frozen-lockfile` exit 1, which fails CI.
  "@tailwindcss/oxide": true
  sharp: true
  # Jest 30's file watcher, reached through apps/mobile's jest-expo. Its
  # postinstall only compiles from source when no prebuilt binary matches the
  # platform; the prebuilt optional packages cover macOS and the Linux runners.
  "@parcel/watcher": false

minimumReleaseAgeExclude:
  - expo-secure-store@57.0.2
  - framer-motion@13.2.0
  - motion-dom@13.2.0
  - motion@13.2.0
  - "@expo/cli@57.0.22 || 57.0.29 || 58.1.13 || 58.1.14"
  - expo-modules-core@57.0.16 || 57.0.22 || 58.0.23
  - expo-modules-jsi@57.0.8 || 57.1.2 || 58.0.16
  - expo@57.0.20 || 57.0.28 || 58.0.16 || 58.0.17
  - "@expo/ui@57.0.16 || 57.0.23 || 58.0.21 || 58.0.22"
  - expo-router@57.0.19 || 57.0.26 || 58.0.24 || 58.0.25
  - expo-sharing@57.0.18 || 57.0.23
  - "@expo/fingerprint@0.20.14"
  - "@expo/inline-modules@0.1.8"
  - "@expo/local-build-cache-provider@57.0.9"
  - "@expo/prebuild-config@57.0.18"
  - babel-preset-expo@57.0.15 || 58.0.18 || 58.0.19
  - expo-modules-autolinking@57.0.15
  - expo-splash-screen@57.0.10
  - expo-updates@57.0.26
  - "@expo/metro-config@58.0.15"
  - "@expo/router-server@58.0.15"
  - expo-asset@58.0.17 || 58.0.18
  - expo-file-system@58.0.10
  - expo-font@58.0.9
  - expo-modules-cli@0.3.1
  - expo-image@58.0.16
  - expo-localization@58.0.5
  - "@expo/env@2.5.3"
  - expo-constants@58.0.13
  - expo-widgets@58.0.22
