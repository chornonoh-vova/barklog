# The production stack for the Dokploy-managed VPS: the API, the worker and
# Valkey, running images published by .github/workflows/images.yml.
#
# Postgres is NOT here — it lives on PlanetScale and is reached over the
# network. For local development use `pnpm deps:up`, which runs
# deps.compose.yaml (Postgres and Valkey only) and leaves the apps on the host.
#
# Rollback: set IMAGE_TAG=sha-abc1234 in Dokploy and redeploy. No file edit,
# no rebuild.
name: barklog

services:
  # Runs to completion before api or worker start, on every deploy. A failed
  # migration therefore blocks the deploy rather than starting the apps against
  # a schema they do not match.
  migrate:
    image: ghcr.io/chornonoh-vova/barklog-migrate:${IMAGE_TAG:-main}
    # Compose's default pull_policy is `missing`. Every GHCR service here pins
    # the mutable ${IMAGE_TAG:-main} tag, so the tag string never changes
    # between deploys and `docker compose up -d` would otherwise have no
    # reason to pull — and if the local image ID is unchanged, it does not
    # recreate the container, it merely restarts the exited one, re-running
    # the OLD binary. `always` makes "migrations apply on every deploy" a
    # property of this file rather than something that depends on Dokploy
    # separately running `docker compose pull`.
    pull_policy: always
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?required — PlanetScale connection string, include sslmode=require}

  api:
    image: ghcr.io/chornonoh-vova/barklog-api:${IMAGE_TAG:-main}
    pull_policy: always # see migrate's comment above
    restart: unless-stopped
    init: true
    # 15s: comfortably past the 10s force-exit timer apps/api/src/index.ts
    # arms on SIGTERM, which is exactly Docker's default 10s stop timeout — at
    # the default grace period, SIGKILL could land the instant the graceful
    # path (draining the server, closing the DB pool and cache client)
    # completes, or before it does.
    stop_grace_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    # No `ports:` anywhere in this file. Traefik reaches the API over
    # dokploy-network; add api.barklog.gg to this service in Dokploy's Domains
    # tab and it injects the routing labels and provisions the certificate.
    expose:
      - "3000"
    networks:
      - default
      - dokploy-network
    environment:
      NODE_ENV: production
      PORT: 3000
      VALKEY_URL: redis://valkey:6379
      DATABASE_URL: ${DATABASE_URL:?required — PlanetScale connection string, include sslmode=require}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?required}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?required}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:?required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?required}
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET:?required}
      REVENUECAT_WEBHOOK_SIGNING_SECRET: ${REVENUECAT_WEBHOOK_SIGNING_SECRET:?required}
      REVENUECAT_API_KEY: ${REVENUECAT_API_KEY:?required}
      IDENTIFY_MODEL: ${IDENTIFY_MODEL:-claude-sonnet-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      # /healthz, not /readyz. A failing healthcheck restarts nothing here —
      # Compose's restart: policies trigger on container exit, never on health
      # status (health-gated restarts are Swarm's behaviour) — but it is not
      # inert either: Traefik's Docker provider drops unhealthy containers from
      # the load balancer. So /readyz would gate routing on dependencies, and a
      # PlanetScale blip would give callers a bare 404 instead of the API's own
      # structured 503 naming what is down. /healthz keeps the container
      # routable and lets the API report its own trouble. If Dokploy runs
      # `up -d --wait`, /readyz would also fail the whole deploy on a transient
      # blip the API survives. wget is busybox's, in the alpine base.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    image: ghcr.io/chornonoh-vova/barklog-worker:${IMAGE_TAG:-main}
    pull_policy: always # see migrate's comment above
    restart: unless-stopped
    init: true
    # 30s: on SIGTERM the worker awaits task.stop(), which may be waiting out
    # an in-flight sync page rather than resolving immediately. The default
    # 10s grace period is enough for the idle case but not for one that lands
    # mid-page.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    # Default network only: nothing outside the project can reach it.
    environment:
      NODE_ENV: production
      VALKEY_URL: redis://valkey:6379
      DATABASE_URL: ${DATABASE_URL:?required — PlanetScale connection string, include sslmode=require}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:?required}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:?required}
      SYNC_CRON: "${SYNC_CRON:-0 0 * * *}"
      SYNC_TZ: ${SYNC_TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # No healthcheck: the worker runs a cron schedule and serves nothing to
    # probe. It relies on restart: unless-stopped.

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    # Persistence off: this holds a cache and rate-limit counters, all of which
    # are reconstructible. Same reasoning as deps.compose.yaml.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  # Created by Dokploy; Traefik is attached to it.
  dokploy-network:
    external: true
