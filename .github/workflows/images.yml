name: Images

# Publishes the api, worker, migrate and landing images to GHCR. Dokploy is not
# notified: deploys stay deliberate, so you press Deploy in its UI when you
# want a new build live.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing four images is not atomic; a run cancelled partway through leaves
# the four :main tags at different commits. Allow superseded runs to finish
# rather than kill them. GitHub keeps at most one pending run per group, so the
# queue cannot grow: a third push replaces the second while the first finishes.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; each job asks for exactly what it uses.
permissions: {}

jobs:
  # The same checks a pull request runs, so main cannot publish what a PR
  # would have failed. A called workflow gets no more than its caller grants.
  verify:
    name: Verify
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  # migrate, api and worker all come out of the root Dockerfile, so they are
  # split by publish order rather than built side by side from scratch.
  # migrate goes first and alone: it runs the expensive pruner, deps, builder
  # and prod-deps stages and writes them to the `barklog` cache scope. A
  # failure partway through — a registry hiccup, a runner OOM, a change that
  # only breaks one target — leaves the three :main tags at different commits.
  # Publishing migrate first means that failure mode is a new schema running
  # old code, which additive Drizzle migrations tolerate; publishing it last
  # would risk the opposite, old schema against new code, which they do not.
  publish-migrate:
    name: Publish migrate
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image: barklog-migrate
      target: migrate
      cache-scope: barklog

  # api and worker in parallel, once migrate is out. Every stage they share
  # with migrate is a cache hit from the scope it just wrote, so each runner
  # adds only its target's final COPY. They read the cache but do not write
  # it: two jobs exporting the same scope at once would race, and the only
  # layer they would add is the one that changes on every commit anyway.
  # fail-fast is off so one target failing still lets the other publish;
  # either way both sit on top of the new schema.
  publish-app:
    name: Publish ${{ matrix.target }}
    needs: publish-migrate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker]
    uses: ./.github/workflows/publish-image.yml
    with:
      image: barklog-${{ matrix.target }}
      target: ${{ matrix.target }}
      cache-scope: barklog
      cache-write: false

  # landing runs beside the three above rather than after them: it is built
  # from its own Dockerfile, shares no stages with them, and nothing depends on
  # the image, so a failure here only leaves the site at the previous commit.
  # Its own cache scope keeps it from contending with publish-migrate over
  # `barklog`.
  publish-landing:
    name: Publish landing
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image: barklog-landing
      target: landing
      file: apps/landing/Dockerfile
      cache-scope: landing
