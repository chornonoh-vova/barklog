name: Images

# Publishes the api, worker, migrate and landing images to GHCR. Dokploy is not
# notified: deploys stay deliberate, so you press Deploy in its UI when you
# want a new build live.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing four images is not atomic; a run cancelled partway through leaves
# the four :main tags at different commits. Allow superseded runs to finish
# rather than kill them. GitHub keeps at most one pending run per group, so the
# queue cannot grow: a third push replaces the second while the first finishes.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; each job asks for exactly what it uses.
permissions: {}

jobs:
  # The same checks a pull request runs, so main cannot publish what a PR
  # would have failed. A called workflow gets no more than its caller grants.
  # id-token on every job below is for the Turborepo remote cache's OIDC
  # exchange (ADR-0008).
  verify:
    name: Verify
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/verify.yml

  # migrate, api and worker all come out of the root Dockerfile, each from a
  # workspace pruned to its own package (the `app` input), so they share no
  # build stages and each keeps its own cache scope. migrate still publishes
  # first and alone. A failure partway through — a registry hiccup, a runner
  # OOM, a change that only breaks one target — leaves the three :main tags at
  # different commits. Publishing migrate first means that failure mode is a
  # new schema running old code, which additive Drizzle migrations tolerate;
  # publishing it last would risk the opposite, old schema against new code,
  # which they do not.
  publish-migrate:
    name: Publish migrate
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image: barklog-migrate
      target: migrate
      app: "@repo/db"
      cache-scope: barklog-migrate

  # api and worker in parallel, once migrate is out, each reading and writing
  # its own scope so the two exports never race. fail-fast is off so one
  # target failing still lets the other publish; either way both sit on top of
  # the new schema.
  publish-app:
    name: Publish ${{ matrix.target }}
    needs: publish-migrate
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker]
    uses: ./.github/workflows/publish-image.yml
    with:
      image: barklog-${{ matrix.target }}
      target: ${{ matrix.target }}
      app: ${{ matrix.target }}
      cache-scope: barklog-${{ matrix.target }}

  # landing runs beside the three above rather than after them: it is built
  # from its own Dockerfile, shares no stages with them, and nothing depends on
  # the image, so a failure here only leaves the site at the previous commit.
  # Its own cache scope keeps it from contending with the other exports.
  publish-landing:
    name: Publish landing
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image: barklog-landing
      target: landing
      file: apps/landing/Dockerfile
      cache-scope: landing
