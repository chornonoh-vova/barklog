name: Images

# Publishes the api, worker, migrate and landing images to GHCR. Dokploy is not
# notified: deploys stay deliberate, so you press Deploy in its UI when you
# want a new build live.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing four images is not atomic; a run cancelled mid-sequence leaves
# the four :main tags at different commits. Allow superseded runs to finish
# rather than kill them. GitHub keeps at most one pending run per group, so the
# queue cannot grow: a third push replaces the second while the first finishes.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build first: check-types and the test suites resolve @repo/* through
      # each package's built .d.ts.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm check-types
      # The suites start Postgres and Valkey through Testcontainers on the
      # runner's Docker daemon. No secrets: the only credential-dependent test
      # is packages/igdb's contract test, which has its own config and its own
      # scheduled workflow.
      - run: pnpm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The first three builds are sequential and share one cache scope on
      # purpose: migrate, api and worker all come out of the root Dockerfile.
      # The second and third hit cache for the pruner, deps and builder stages,
      # so the expensive work happens exactly once. A matrix would run those
      # stages three times in parallel and contend over the cache. landing
      # writes into the same cache scope but is built from its own Dockerfile,
      # so its pruner, deps and builder stages are its own entries and it
      # reuses nothing from the three above.

      # migrate publishes first, then api, then worker, then landing. Each
      # push is independent, so a failure partway through this sequence — a registry
      # hiccup, a runner OOM, a change that only breaks one target — leaves
      # the four :main tags at different commits. Publishing migrate first
      # means that failure mode is a new schema running old code, which
      # additive Drizzle migrations tolerate; publishing it last would risk
      # the opposite, old schema against new code, which they do not.

      - id: meta-migrate
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/barklog-migrate
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha,scope=barklog
          cache-to: type=gha,scope=barklog,mode=max
          # Single-platform build: an attestation would add the unknown/unknown
          # manifest entry that clutters GHCR's package UI.
          provenance: false

      - id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/barklog-api
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=barklog
          cache-to: type=gha,scope=barklog,mode=max
          provenance: false

      - id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/barklog-worker
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha,scope=barklog
          cache-to: type=gha,scope=barklog,mode=max
          provenance: false

      # Last in the sequence, and deliberately so: nothing depends on the
      # landing image, so a failure here leaves the site at the previous
      # commit — the harmless direction, unlike the migrate-first ordering
      # reasoned about above.
      - id: meta-landing
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/barklog-landing
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/landing/Dockerfile
          target: landing
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-landing.outputs.tags }}
          labels: ${{ steps.meta-landing.outputs.labels }}
          cache-from: type=gha,scope=barklog
          cache-to: type=gha,scope=barklog,mode=max
          provenance: false
