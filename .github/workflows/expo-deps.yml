name: Expo dependencies

# Dependabot ignores the packages the Expo SDK pins (see dependabot.yml): they
# have to move together, to the versions the installed `expo` expects. This
# runs `expo install --fix` weekly and, when it changed anything, pushes the
# result to one branch and opens a PR if none is open yet. SDK upgrades stay
# manual: --fix only moves within the current SDK.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# One run at a time: two runs would force-push the same branch.
concurrency:
  group: expo-deps
  cancel-in-progress: false

# Nothing by default; the job asks for exactly what it uses.
permissions: {}

jobs:
  fix:
    name: expo install --fix
    runs-on: ubuntu-latest
    # contents to push the branch, pull-requests to open the PR. Opening the PR
    # also needs the repo setting "Allow GitHub Actions to create and approve
    # pull requests".
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: chore/expo-deps
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Rewrites apps/mobile/package.json and pnpm-lock.yaml. A version newer
      # than pnpm's minimumReleaseAge fails the install here; the next week's
      # run picks it up once it has aged.
      - name: Fix Expo versions
        run: pnpm --filter mobile exec expo install --fix
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- apps/mobile/package.json pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Expo dependencies are current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Force-push: the branch only ever holds one commit on top of main, so an
      # open PR is refreshed in place rather than stacking weekly commits.
      - name: Push branch
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "build(mobile): align Expo SDK dependencies" -- apps/mobile/package.json pnpm-lock.yaml
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
      - name: Open PR if none is open
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "build(mobile): align Expo SDK dependencies" \
              --body "Weekly \`expo install --fix\` for \`apps/mobile\`, by \`.github/workflows/expo-deps.yml\`."
          fi
          echo "Expo dependencies changed; PR is open on \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
