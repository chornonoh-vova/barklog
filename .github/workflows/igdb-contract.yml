name: IGDB contract

# IGDB retires fields on its own schedule. This turns "did we use a deprecated
# field?" into a build failure, and catches removals the day they land.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/igdb build
      - run: pnpm --filter @repo/igdb test:contract
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
