name: IGDB contract

# IGDB retires fields on its own schedule. This turns "did we use a deprecated
# field?" into a build failure, and catches removals the day they land.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Read-only: it clones and runs one test. The IGDB credentials come from
# secrets, not from the token. id-token is for the Turborepo remote cache's
# OIDC exchange.
permissions:
  contents: read
  id-token: write

jobs:
  contract:
    name: IGDB contract test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Before the install, which runs mobile's postinstall turbo build.
      - name: Set up Turborepo remote cache
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # turbo, not `pnpm --filter ... build`: the contract test imports
      # @repo/cache, which resolves through that package's built dist.
      # `pnpm --filter` builds igdb alone; turbo's `^build` pulls the
      # workspace dependency in with it.
      - name: Build @repo/igdb and its dependencies
        run: pnpm turbo run build --filter=@repo/igdb
      - name: Run contract test against IGDB
        run: pnpm --filter @repo/igdb test:contract
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
