# Included explicitly by EVERY location block in default.conf.
#
# nginx's add_header does not inherit into a location block that declares its
# own add_header. The /_astro/ block sets Cache-Control, so without this
# include it would serve every script and stylesheet with no security
# headers — and nothing would look wrong. test/nginx.test.ts enforces it.

# 'none' by default, then only what the site genuinely uses. No 'unsafe-inline'
# anywhere, which is only possible because astro.config.mjs sets
# build.inlineStylesheets to "never" and the site emits no inline script.
#
# manifest-src and connect-src are deliberately absent, not just unlisted:
# there is no webmanifest and no fetch/XHR/WebSocket/beacon call, so
# default-src 'none' already blocks them, and adding either later is a
# conscious act that can carry its own CSP edit. img-src keeps 'self' data:
# even though nothing currently uses a data: URI, because Astro's build can
# start inlining a small image that way with no source change on our part —
# unlike the other two, removing it invites a silent breakage.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;

# No preload: submission to browsers' built-in HSTS preload lists is
# effectively irreversible, and includeSubDomains from the apex already
# covers api.barklog.gg.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Redundant with frame-ancestors above, kept for user agents that predate it.
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
