server {
    # 8080, not 80: nginx-unprivileged cannot bind a privileged port.
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # Without this, an intermediate cache (or Traefik) can serve a compressed
    # response to a client that never asked for one.
    gzip_vary on;

    # Cheap and unlogged, so the compose healthcheck costs nothing. Matches the
    # API's /healthz convention.
    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        # default_type, not add_header Content-Type: add_header only appends,
        # so a Content-Type add_header here would ride alongside nginx's own
        # default (application/octet-stream) rather than replacing it.
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed filenames, so they can never go stale.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        # Astro builds directory-format output, so /terms is terms/index.html.
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }
}
