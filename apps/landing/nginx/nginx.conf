# Replaces the stock image's /etc/nginx/nginx.conf so nginx runs as the
# unprivileged `nginx` user. Three things differ from upstream: no `user`
# directive (it only means something when the master starts as root), the pid
# file in /tmp rather than root-owned /run, and the temp paths in /tmp rather
# than root-owned /var/cache/nginx. The rest is upstream's defaults.

worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
